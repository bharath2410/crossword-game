{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">

  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'game/icons/icon-192.png' %}">
  <link rel="manifest" href="{% static 'game/manifest.json' %}">
  <link rel="stylesheet" href="{% static 'game/css/style.css' %}?v=10">
  <title>Crossword Duel</title>
</head>
<body>

  <div class="game-wrapper">
    <!-- Streamlined Header -->
    <header class="app-header">
      <div class="score-card">
        <span class="score-label">SCORE</span>
        <span id="score" class="score-val">0</span>
      </div>

      <div class="center-meta">
        <span id="timer-pill" class="meta-pill">⏱️ 04:30</span>
        <span id="bag-pill" class="meta-pill">🎒 93 left</span>
      </div>

      <div class="top-buttons">
        <button id="history-btn" class="icon-circle-btn" title="Word History">📖</button>
        <button id="submit-btn" class="btn play-btn">Play ➔</button>
      </div>
    </header>

    <!-- Crossword Board -->
    <main class="grid-container">
      <div id="board" class="crossword-grid"></div>
    </main>

    <!-- Bottom Deck: Controls + Dynamic Rack -->
    <footer class="bottom-deck">
      <div class="control-strip">
        <button id="toggle-dir-btn" class="action-btn">ACROSS →</button>
        <button id="shuffle-btn" class="action-btn">🔀 Shuffle</button>
        <button id="swap-btn" class="action-btn">🔄 Swap</button>
        <button id="clear-btn" class="action-btn danger-text">Clear</button>
      </div>

      <div id="rack" class="letter-rack"></div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="message-toast" class="toast hidden"></div>

  <!-- Dictionary & History Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Word History</h3>
        <button id="modal-close" class="close-btn">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="{% static 'game/js/game.js' %}?v=10"></script>
</body>
</html>
