{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crossword Duel</title>
  <link rel="stylesheet" href="{% static 'game/css/style.css' %}">
</head>
<body>

  <div class="game-card">
    <header class="game-header">
      <div class="score-badge">SCORE: <span id="score">0</span></div>
      <button id="submit-btn" class="btn primary">Play Word ➔</button>
    </header>

    <main>
      <div id="board" class="crossword-grid"></div>

      <div class="controls">
        <button id="toggle-dir-btn" class="btn secondary">ACROSS ➔</button>
        <button id="shuffle-btn" class="btn secondary">🔀 Shuffle</button>
        <button id="swap-btn" class="btn warning">🔄 Swap</button>
        <button id="clear-btn" class="btn danger">Clear</button>
      </div>

      <div id="rack" class="letter-rack"></div>
    </main>
  </div>

  <div id="message-toast" class="toast hidden"></div>

  <script src="{% static 'game/js/game.js' %}"></script>
</body>
</html>
