{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">

  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'game/icons/icon-192.png' %}">
  <link rel="manifest" href="{% static 'game/manifest.json' %}">
  <link rel="stylesheet" href="{% static 'game/css/style.css' %}?v=13">
  <title>Crossword Duel</title>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="game-wrapper">
    <!-- Top Stat Row -->
    <div class="stat-bar">
      <span class="stat-pill" id="bot-indicator">👤 Solo Mode</span>
      <span class="stat-pill">🎒 <span id="bag-count">100</span> left</span>
      <span class="stat-pill">⏱️ <span id="timer-text">05:00</span></span>
    </div>

    <!-- Main Header -->
    <header class="app-header">
      <div class="scores-group">
        <div class="score-card">
          <span class="score-label">YOU</span>
          <span id="score" class="score-val">0</span>
        </div>
        <div id="bot-score-badge" class="score-card" style="display: none;">
          <span class="score-label" style="color: #f43f5e;">BOT</span>
          <span id="bot-score" class="score-val" style="color: #f43f5e;">0</span>
        </div>
      </div>

      <div class="top-buttons">
        <button id="mode-btn" class="icon-circle-btn" title="Toggle AI Duel">🤖</button>
        <button id="leaderboard-btn" class="icon-circle-btn" title="Leaderboard">🏆</button>
        <button id="history-btn" class="icon-circle-btn" title="Word History">📖</button>
        <button id="new-game-btn" class="icon-circle-btn" title="Restart">🔄</button>
        <button id="submit-btn" class="btn play-btn">Play ➔</button>
      </div>
    </header>

    <!-- Word Preview -->
    <div id="word-preview" class="word-preview hidden">
      <span id="preview-word">---</span>
      <span id="preview-score" class="preview-pts">+0 pts</span>
    </div>

    <!-- Board -->
    <main class="grid-container">
      <div id="board" class="crossword-grid"></div>
    </main>

    <!-- Bottom Deck -->
    <footer class="bottom-deck">
      <div class="control-strip">
        <button id="shuffle-btn" class="action-btn">🔀 Shuffle</button>
        <button id="swap-btn" class="action-btn">🔄 Swap</button>
        <button id="clear-btn" class="action-btn danger-text">Clear</button>
      </div>

      <div id="rack" class="letter-rack"></div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="message-toast" class="toast hidden"></div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Word History</h3>
        <button id="modal-close" class="close-btn">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="{% static 'game/js/game.js' %}?v=14"></script>
  <script>
    // Clear old service worker caches so outdated styles never reload
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(keys => {
        keys.forEach(key => caches.delete(key));
      });
    }
  </script>
</body>
</html>
